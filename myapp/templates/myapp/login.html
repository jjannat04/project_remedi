{% extends 'myapp/base.html' %}

{% block content %}
<div class="min-h-screen py-12 px-4 flex items-center">
    <div class="max-w-3xl mx-auto">
        
        <!-- Header & Impact Note -->
        <div class="text-center mb-10">
            <span class="app-badge mx-auto mb-4 bg-emerald-50 text-teal-700 ring-1 ring-emerald-100">
                <i class="bi bi-shield-lock"></i> Secure Access
            </span>
            <h1 class="text-4xl font-black text-slate-950 mb-2">Login to ReMedi</h1>
            <p class="text-slate-500">Continue managing circular healthcare workflows.</p>
        </div>

        <div class="app-card overflow-hidden">

                <!-- Right Side: The Form -->
                <div class="p-8 lg:p-12">
                    <form method="post" class="space-y-6">
                        {% csrf_token %}
                        
                        {% for field in form %}
                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-2">
                                {{ field.label }}
                            </label>
                            <div class="relative">
                                {{ field }}
                            </div>
                            {% if field.errors %}
                                <p class="text-red-500 text-xs mt-1">{{ field.errors.0 }}</p>
                            {% endif %}
                        </div>
                        {% endfor %}

                        <button type="submit" class="app-btn app-btn-primary w-full py-4">
                            <i class="bi bi-box-arrow-in-right"></i>Log In
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
