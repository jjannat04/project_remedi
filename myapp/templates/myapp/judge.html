{% extends 'myapp/base.html' %}

{% block content %}
<main class="max-w-3xl mx-auto px-4 py-16">
    <section class="bg-white border border-slate-200 rounded-xl shadow-sm p-8 text-center">
        <h1 class="text-3xl font-black text-slate-900 mb-3">Welcome to ReMedi Demo</h1>
        <p class="text-slate-600 mb-8">This demo uses seeded data for judges.</p>

        <div class="mb-8">
            <a href="{% url 'judge_ocr' %}" class="inline-flex items-center justify-center bg-slate-100 text-slate-700 px-4 py-2 rounded-lg text-sm font-bold hover:bg-slate-200 transition-colors">
                Test Gemini OCR Foundation
            </a>
        </div>

        <div class="flex flex-col sm:flex-row justify-center gap-4">
            <form method="post" action="{% url 'judge_demo_login' 'donor' %}">
                {% csrf_token %}
                <button type="submit" class="w-full sm:w-auto bg-emerald-600 text-white px-5 py-3 rounded-lg text-sm font-bold hover:bg-emerald-700 transition-colors">
                    Enter as Demo Donor
                </button>
            </form>
            <form method="post" action="{% url 'judge_demo_login' 'pharmacist' %}">
                {% csrf_token %}
                <button type="submit" class="w-full sm:w-auto bg-amber-500 text-white px-5 py-3 rounded-lg text-sm font-bold hover:bg-amber-600 transition-colors">
                    Enter as Demo Central Pharmacist
                </button>
            </form>
        </div>
    </section>
</main>
{% endblock %}
