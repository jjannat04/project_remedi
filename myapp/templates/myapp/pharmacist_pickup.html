{% extends 'myapp/base.html' %}

{% block content %}
<main class="max-w-3xl mx-auto px-4 py-10">
    <section class="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm">
        <p class="text-xs font-black uppercase tracking-widest text-sky-600 mb-2">Pharmacist Pickup</p>
        <h1 class="text-3xl font-black text-slate-900 mb-6">Verify Pickup OTP</h1>

        {% if result %}
            {% if result.success %}
            <div class="mb-6 rounded-xl border border-emerald-100 bg-emerald-50 p-4 text-emerald-800 font-bold">
                {{ result.message }}
            </div>
            {% else %}
            <div class="mb-6 rounded-xl border border-red-100 bg-red-50 p-4 text-red-800 font-bold">
                {{ result.message }}
            </div>
            {% endif %}
        {% endif %}

        <form method="post" class="space-y-4">
            {% csrf_token %}
            <div>
                <label for="identifier" class="block text-sm font-bold text-slate-700 mb-1">QR ID or Medicine ID</label>
                <input id="identifier" name="identifier" type="text" required class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:border-sky-500 focus:outline-none">
            </div>
            <div>
                <label for="otp" class="block text-sm font-bold text-slate-700 mb-1">Pickup OTP</label>
                <input id="otp" name="otp" type="text" inputmode="numeric" pattern="[0-9]{6}" required class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:border-sky-500 focus:outline-none">
            </div>
            <button type="submit" class="rounded-lg bg-sky-600 px-4 py-3 text-sm font-bold text-white hover:bg-sky-700">
                Verify Pickup
            </button>
        </form>
    </section>
</main>
{% endblock %}
