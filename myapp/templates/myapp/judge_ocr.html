{% extends 'myapp/base.html' %}

{% block content %}
<main class="max-w-3xl mx-auto px-4 py-12">
    <section class="bg-white border border-slate-200 rounded-xl shadow-sm p-8">
        <div class="mb-8">
            <h1 class="text-3xl font-black text-slate-900 mb-2">Medicine OCR Test</h1>
            <p class="text-slate-600">Upload one medicine package image to test the service-layer OCR foundation.</p>
        </div>

        <form method="post" enctype="multipart/form-data" class="space-y-5">
            {% csrf_token %}
            <div>
                <label for="medicine_image" class="block text-sm font-bold text-slate-700 mb-2">Medicine package image</label>
                <input id="medicine_image" name="medicine_image" type="file" accept="image/*" class="w-full rounded-lg border border-slate-200 bg-slate-50 px-4 py-3">
            </div>
            <button type="submit" class="bg-emerald-600 text-white px-5 py-3 rounded-lg text-sm font-bold hover:bg-emerald-700 transition-colors">
                Analyze Image
            </button>
        </form>

        {% if result %}
        <div class="mt-8 rounded-lg border {% if result.used_fallback %}border-amber-200 bg-amber-50 text-amber-800{% else %}border-emerald-200 bg-emerald-50 text-emerald-800{% endif %} px-4 py-3 text-sm font-medium">
            {{ result.message }}
        </div>
        <div class="mt-8 bg-slate-950 text-slate-50 rounded-xl p-5 overflow-x-auto">
            <p class="text-xs font-bold uppercase tracking-wide text-emerald-300 mb-3">Extracted JSON</p>
            <pre class="text-sm whitespace-pre-wrap">{{ result_json }}</pre>
        </div>
        {% endif %}
    </section>
</main>
{% endblock %}
